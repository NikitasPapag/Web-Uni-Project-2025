<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Project</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="header-container"></div>

  <div id="main-content"></div>

<script>
   //Arxiko setup
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-container').innerHTML = html;
        setupHeaderEvents();
        updateHeaderButtons();
        loadArxiki();
      });

    function setupHeaderEvents() {
      // Listener gia ta koumpia tou header
      document.addEventListener('click', (e) => {
        if (e.target.id === 'arxiki-btn') {
          loadArxiki();
        }
        if (e.target.id === 'eisodos-btn') {
          loadLoginForm();
        }
        if (e.target.id === 'aposyndesi-btn') {
          localStorage.clear(); // Svisimo twn dedomenwn ths sundeshs
          loadArxiki();
        }
        if (e.target.id === 'user-button') {
          const rolos = localStorage.getItem('rolos');
          const username = localStorage.getItem('username');
          if (rolos) {
            loadSelidaXristi(rolos, username);
          }
        }
      });
      
      // Listener gia thn ypovoli tou login form 
      document.addEventListener('submit', async (e) => {
        // To ID tou login form einai 'loginForm'
        if (e.target.id === 'loginForm') {
          e.preventDefault();
          const usernameInput = e.target.querySelector('#username').value.trim().toLowerCase();
          const passwordInput = e.target.querySelector('#password').value;
          const errorMsg = document.getElementById('errorMsg');
          
          try {
            const res = await fetch('http://localhost:3000/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });
    
            const data = await res.json();
            if (res.ok) {
              // Apothikeusi dedomenwn sundeshs sto localStorage
              localStorage.setItem('id', data.id);
              localStorage.setItem('username', data.username);
              localStorage.setItem('rolos', data.rolos);
              
              await loadSelidaXristi(data.rolos, data.username);
            } else {
              errorMsg.textContent = data.error || 'Αποτυχία σύνδεσης.';
            }
          } catch (err) {
            errorMsg.textContent = 'Σφάλμα σύνδεσης. Ελέγξτε τον server.';
          }
        }
      });
    }

function updateHeaderButtons() {
  const username = localStorage.getItem('username');

  const eisodosBtn = document.getElementById('eisodos-btn');
  const aposyndesiBtn = document.getElementById('aposyndesi-btn');
  const userBtn = document.getElementById('user-button');

  if (username) {
    eisodosBtn.style.display = 'none';
    aposyndesiBtn.style.display = 'inline-block';
    userBtn.style.display = 'inline-block';

    // Orismos onomatos xristi sto koumpi
    userBtn.textContent = username;
  } else {
    eisodosBtn.style.display = 'inline-block';
    aposyndesiBtn.style.display = 'none';
    userBtn.style.display = 'none';
  }
}
    function loadArxiki() {
      document.getElementById('main-content').innerHTML = `
        <div class="welcome-message centered">
          <h1>Καλωσήρθατε στην Πλατφόρμα</h1>
          <p>Χρησιμοποιήστε την πλοήγηση στο επάνω μέρος για να συνδεθείτε ή να περιηγηθείτε.</p>
        </div>
      `;
      updateHeaderButtons();
    }

    function loadLoginForm() {
      document.getElementById('main-content').innerHTML = `
        <form id="loginForm" class="login-form">
          <input type="text" id="username" placeholder="Εισάγετε το username σας." required />
          <input type="password" id="password" placeholder="Εισάγετε τον κωδικό σας." required />
          <button type="submit">Είσοδος</button>          
          <p id="errorMsg" class="error-msg"></p>
        </form>
      `;

      updateHeaderButtons();
    }

    async function loadSelidaXristi(rolos, username) {
  try {
    const response = await fetch(`${rolos}.html`);
    if (!response.ok) {
      throw new Error(`Failed to load ${rolos}.html`);
    }
    const html = await response.text();
    const mainContent = document.getElementById('main-content');
    mainContent.innerHTML = html;

    // Ektelesi tou script apo to HTML pou fortwthke
    const scriptElement = mainContent.querySelector('script');
    if (scriptElement) {
        const newScript = document.createElement('script');
        newScript.textContent = scriptElement.textContent;
        document.body.appendChild(newScript);
    }

    // Klhsh synarthshs arxikopoihshs analoga ton rolo tou xristi
    if (rolos === 'foititis') {
        if (typeof initFoititisPage === 'function') {
            initFoititisPage(username);
        }
    } else if (rolos === 'didaskon') {
        if (typeof initDidaskonPage === 'function') {
            initDidaskonPage(username);
        }
    }
    updateHeaderButtons();
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<p>Error loading ${rolos} page: ${e.message}</p>`;
    console.error(e);
  }
}
</script>
</body>
</html>
