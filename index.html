<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Project</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="header-container"></div>

  <div id="main-content"></div>

  <script>
    const xristes = {
      "alice": "foititis",
      "bob": "didaskon",
      "carol": "grammateia"
    };

    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-container').innerHTML = html;
        setupHeaderEvents();
        loadArxiki();
      });

    function setupHeaderEvents() {
      document.addEventListener('click', (e) => {
        if (e.target.id === 'arxiki-btn') {
          loadArxiki();
        }

        if (e.target.id === 'eisodos-btn') {
          loadLoginForm();
        }

        if (e.target.id === 'aposyndesi-btn') {
          localStorage.removeItem('username');
          loadArxiki();
        }

        if (e.target.id === 'logariasmos-btn') {
          e.preventDefault();
          const username = localStorage.getItem('username');
          if (username && xristes[username] === 'foititis') {
            loadLogariasmosFoititi(username);
          }
        }
      });
    }

    function updateHeaderButtons() {
      const username = localStorage.getItem('username');
      const typosXristi = xristes[username];

      const eisodosBtn = document.getElementById('eisodos-btn');
      const logariasmosBtn = document.getElementById('logariasmos-btn');
      const aposyndesiBtn = document.getElementById('aposyndesi-btn');

      if (username) {
        eisodosBtn.style.display = 'none';
        aposyndesiBtn.style.display = 'inline-block';

        if (typosXristi === 'foititis') {
          logariasmosBtn.style.display = 'inline-block';
        } else {
          logariasmosBtn.style.display = 'none';
        }
      } else {
        eisodosBtn.style.display = 'inline-block';
        logariasmosBtn.style.display = 'none';
        aposyndesiBtn.style.display = 'none';
      }
    }

    function loadArxiki() {
  document.getElementById('main-content').innerHTML = `
    <div class="welcome-message centered">
      <h1>Καλωσήρθατε στην Πλατφόρμα</h1>
      <p>Χρησιμοποιήστε την πλοήγηση στο επάνω μέρος για να συνδεθείτε ή να περιηγηθείτε.</p>
    </div>
  `;
  updateHeaderButtons();
}

    function loadLoginForm() {
      document.getElementById('main-content').innerHTML = `
        <form id="loginForm" class="login-form">
          <input type="text" id="username" placeholder="Εισάγετε το username σας." required />
          <button type="submit">Login</button>
          <p id="errorMsg" class="error-msg"></p>
        </form>
      `;

      updateHeaderButtons();

      document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim().toLowerCase();
        const errorMsg = document.getElementById('errorMsg');

        if (xristes[username]) {
          const typosXristi = xristes[username];
          localStorage.setItem('username', username);
          await loadSelidaXristi(typosXristi, username);
        } else {
          errorMsg.textContent = "Το username είναι λάθος.";
        }
      });
    }

    async function loadSelidaXristi(typosXristi, username) {
      try {
        const response = await fetch(`${typosXristi}.html`);
        const html = await response.text();
        document.getElementById('main-content').innerHTML = html;

        const span = document.getElementById('usernameDisplay');
        if (span) {
          span.textContent = username.charAt(0).toUpperCase() + username.slice(1);
        }

        updateHeaderButtons();
      } catch {
        document.getElementById('main-content').innerHTML = `<p>Error loading ${typosXristi} page.</p>`;
      }
    }

    async function loadLogariasmosFoititi(username) {
      try {
        const response = await fetch('logariasmos_foititi.html');
        if (!response.ok) throw new Error('Η σελίδα δεν υπάρχει.');

        const html = await response.text();
        document.getElementById('main-content').innerHTML = html;

        const span = document.getElementById('usernameDisplay');
        if (span) {
          span.textContent = username.charAt(0).toUpperCase() + username.slice(1);
        }

        updateHeaderButtons();
      } catch {
        document.getElementById('main-content').innerHTML = `<p>Σφάλμα κατά την φόρτωση της σελίδας χρήστη.</p>`;
      }
    }
  </script>
</body>
</html>
