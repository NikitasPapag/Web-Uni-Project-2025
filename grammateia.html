  <h1>Καλωσήρθατε, <span id="usernameDisplay"></span>!</h1>

<script>
  const username = localStorage.getItem('username');
  const nameSpan = document.getElementById('usernameDisplay');

  if (username && nameSpan) {
    nameSpan.textContent = username.charAt(0).toUpperCase() + username.slice(1);
  } else {
    // Optional: redirect or reload main view if loaded out of context
    document.getElementById('main-content').innerHTML = '<p>Unauthorized. Please log in.</p>';
  }
</script>
