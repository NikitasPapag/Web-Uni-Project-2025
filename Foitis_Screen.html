<!-- Arxiko HTML gia emfanisi xristi foititi -->
<div class="foititis centered">
  <h1>Καλωσήρθατε, <span id="emfanisi_email"></span>!</h1>
  <div id="epiloges_foititi">
    <button onclick="provoliThematos()">1) Προβολή Θέματος</button>
    <button onclick="epexergasiaProfil()">2) Επεξεργασία Προφίλ</button>
    <button onclick="diaxeirisiDiplwmatikis()">3) Διαχείριση Διπλωματικής</button>
  </div>
  <div id="periexomeno_foititi"></div>
</div>

<script>
// Fortwnei apo localStorage to email pou einai to username
const email_xristi = localStorage.getItem('username');
const emfanisi_email = document.getElementById('emfanisi_email');

if (email_xristi && emfanisi_email) {
  emfanisi_email.textContent = email_xristi;
} else {
  document.getElementById('periexomeno_foititi').innerHTML = '<p>Μη εξουσιοδοτημένη πρόσβαση. Κάνε είσοδο.</p>';
}

// SYNARTHSH: Emfanizei plirofories gia to thema pou exei analavei o foititis
function provoliThematos() {
  const thema = {
    titlos: "Εφαρμογή Διαχείρισης Διπλωματικών",
    perigrafi: "Πληροφοριακό σύστημα με HTML/CSS/JS και MySQL.",
    katastasi: "Ενεργή",
    hmerominia_anathesis: "2025-06-01",
    trimeris: ["Dr. Παπαδόπουλος", "Dr. Νικολάου", "Dr. Ιωάννου"]
  };

  const meres = meresApoAnathesi(thema.hmerominia_anathesis);
  document.getElementById('periexomeno_foititi').innerHTML = `
    <h2>Θέμα: ${thema.titlos}</h2>
    <p>Περιγραφή: ${thema.perigrafi}</p>
    <p>Κατάσταση: ${thema.katastasi}</p>
    <p>Ημερομηνία Ανάθεσης: ${thema.hmerominia_anathesis} (${meres} ημέρες πριν)</p>
    <p>Τριμελής Επιτροπή: ${thema.trimeris.join(', ')}</p>
  `;
}

// SYNARTHSH: Emfanizei stixia profil me dynatotita epeksergasias
function epexergasiaProfil() {
  const profil = {
    dieythinsi: "Οδός 28ης Οκτωβρίου, Αριθμός 5, Πάτρα",
    tilefono_kinhto: "6912345678",
    tilefono_stathero: "2610123456",
    email: email_xristi
  };

  document.getElementById('periexomeno_foititi').innerHTML = `
    <h2>Επεξεργασία Προφίλ</h2>
    <label>Διεύθυνση: <input type="text" value="${profil.dieythinsi}"></label><br>
    <label>Κινητό: <input type="text" value="${profil.tilefono_kinhto}"></label><br>
    <label>Σταθερό: <input type="text" value="${profil.tilefono_stathero}"></label><br>
    <label>Email: <input type="text" value="${profil.email}"></label><br>
    <button>Αποθήκευση Αλλαγών</button>
  `;
}

// SYNARTHSH: Diaxeirisi diplwmatikhs analoga me katastasi
function diaxeirisiDiplwmatikis() {
  const katastasi = "ypo_exetasi";
  let html = `<h2>Διαχείριση Διπλωματικής - Κατάσταση: ${katastasi}</h2>`;

  if (katastasi === "ypo_anathesi") {
    html += `
      <p>Επιλέξτε μέλη τριμελούς επιτροπής:</p>
      <select><option>Dr. Νικολάου</option><option>Dr. Ζαφειρίου</option></select>
      <button>Προσθήκη Μέλους</button>
    `;
  } else if (katastasi === "ypo_exetasi") {
    html += `
      <p>Μεταφόρτωση αρχείου διπλωματικής (PDF): <input type="file"></p>
      <p>Προσθήκη συνδέσμου (π.χ. Google Drive): <input type="text"></p>
      <p>Ημερομηνία Εξέτασης: <input type="date"></p>
      <p>Ώρα: <input type="time"></p>
      <p>Τρόπος: <select><option>Δια ζώσης</option><option>Online</option></select></p>
      <p>Τοποθεσία/Σύνδεσμος: <input type="text"></p>
      <button>Αποθήκευση Στοιχείων</button>
      <hr>
      <h3>Πρακτικό Εξέτασης</h3>
      <p>Βλέπετε το πρακτικό σε μορφή HTML.</p>
      <p>Σύνδεσμος Νημερτής: <input type="text"></p>
    `;
  } else if (katastasi === "peratomeni") {
    html += `
      <p>Η διπλωματική έχει ολοκληρωθεί. Μπορείτε να δείτε το ιστορικό καταστάσεων και το πρακτικό.</p>
      <button>Προβολή Καταστάσεων</button>
      <button>Προβολή Πρακτικού</button>
    `;
  }

  document.getElementById('periexomeno_foititi').innerHTML = html;
}

// SYNARTHSH: Ypologismos merwn apo hmerominia
function meresApoAnathesi(imerominia) {
  const simera = new Date();
  const anathesi = new Date(imerominia);
  const diafora = Math.floor((simera - anathesi) / (1000 * 60 * 60 * 24));
  return diafora;
}
</script>
