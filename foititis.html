  <header>
    <h1>Καλώς ήρθατε <span id="helloUser"></span> ! <br> Χρησιμοποιήστε τα κουμπιά για να περιηγηθείτε.</h1>
  </header>

  <main>
    <div class="actions">
      <button id="btnMyDiplomatiki">Προβολή Θέματος</button>
      <button id="btnManageDiplomatiki">Διαχείριση Διπλωματικής</button>
      <button id="btnArxeia">Αρχεία</button>
      <button id="btnOrismosImerominias">Ορισμός Ημερομηνίας Παρουσίασης</button>
      <button id="btnEditProfile">Επεξεργασία Προφίλ</button>
    </div>

    <div id="content"></div>
  </main>

  <script>
  {
    // Pairnei id foititi & onoma xristi apo localStorage
    const id = localStorage.getItem('id');
    const username = localStorage.getItem('username');
    const rolos = localStorage.getItem('rolos');
    const API_BASE = 'http://localhost:3000/api';

    // To swsto content container ID
    const content = document.getElementById('content');
    const helloUserEl = document.getElementById('helloUser');

    // Welcome message an yparxei o foititis
    if (helloUserEl) {
      helloUserEl.textContent = username || 'Φοιτητή';
    }

    // Aplo guard an den yparxei session
    if (!id || rolos !== 'foititis') {
      content.innerHTML = `
        <div class="card error">
          <h2>Σφάλμα Πρόσβασης</h2>
          <p>Δεν είστε συνδεδεμένος/η ως Φοιτητής. Παρακαλώ κάντε είσοδο.</p>
        </div>`;
    } else {
      // Arxikopoihsh selidas kai provoli username
      const usernameDisplay = document.getElementById('usernameDisplay');
      if (usernameDisplay) usernameDisplay.textContent = username;
    }
    
    function translateStatus(status) {
      const statusMap = {
        'energi': 'Ενεργή',
        'ypo_exetasi': 'Υπό Εξέταση',
        'ypo_anathesi': 'Υπό Ανάθεση',
        'peratomeni': 'Περατωμένη',
        'akyromeni': 'Ακυρωμένη'
      };
      return statusMap[status] || status;
    }

    // Boithitiki synartisi gia ypologismo xronou pou exei perasei
    function getTimeElapsed(dateString) {
      if (!dateString) return "—";
      const start = new Date(dateString);
      const now = new Date();
      
      const diffTime = Math.abs(now - start);
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (totalDays < 1) return "Σήμερα";
      if (totalDays === 1) return "Εχθές";
      if (totalDays < 30) return `${totalDays} ημέρες`;
      
      if (totalDays < 365) {
          const months = Math.floor(totalDays / 30);
          return months === 1 ? "1 μήνας" : `${months} μήνες`;
      } 
      
      const years = Math.floor(totalDays / 365);
      const remainingDays = totalDays % 365;
      const extraMonths = Math.floor(remainingDays / 30);

      let output = years === 1 ? "1 χρόνος" : `${years} χρόνια`;
      
      if (extraMonths > 0) {
          output += extraMonths === 1 ? " και 1 μήνας" : ` και ${extraMonths} μήνες`;
      }
      
      return output;
    }

    // Kanei fetch me aplo error handling
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, options);
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) {
        const msg = data && data.error ? data.error : 'Σφάλμα αιτήματος.';
        throw new Error(msg);
      }
      return data;
    }

    // Provoli trexoysas diplomatikis
async function showMyDiplomatiki() {
      if (!id) {
        content.innerHTML = `<div class="card error">Δεν βρέθηκε συνεδρία χρήστη.</div>`;
        return;
      }
      try {
        const d = await apiFetch(`${API_BASE}/diplomatiki/byFoititis/${id}`);
        
        const dateObj = new Date(d.hmerominia_anathesis);
        const formattedDate = d.hmerominia_anathesis ? dateObj.toLocaleDateString('el-GR') : '—';
        const elapsed = getTimeElapsed(d.hmerominia_anathesis);
        const greekStatus = translateStatus(d.katastasi);

        content.innerHTML = `
          <div class="card">
            <div class="diplomatiki-header" style="cursor: default; padding: 0 0 10px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
                <h2 style="margin:0; text-align: center;">Η Διπλωματική μου</h2>
                <span class="status-pill status-${d.katastasi}">${greekStatus}</span>
            </div>

            <div class="sep"></div>

            <h3 style="text-align: center;">${d.titlos}</h3>
            
            <p>${d.perigrafi || ''}</p>
            
            ${d.perigrafi_arxeio 
                ? `<div style="text-align:center; margin-bottom:15px;">
                     <a href="/uploads/${d.perigrafi_arxeio}" target="_blank" class="button alt" style="font-size: 0.9em; display:inline-block;">
                       📄 Προβολή Αρχείου Περιγραφής (PDF)
                     </a>
                   </div>` 
                : `<p class="muted" style="text-align:center;">Δεν υπάρχει συνημμένο αρχείο περιγραφής.</p>`
            }

            <div class="list-item" style="background: #f3f4f6; margin-top: 20px; border-radius: 8px;">
                <p><strong>Ημερομηνία Ανάθεσης:</strong> ${formattedDate}</p>
                <p><strong>Χρόνος υλοποίησης:</strong> ${elapsed}</p>
                <p><strong>Τριμελής Επιτροπή:</strong> ${d.melh_trimelous || '<span class="muted">Δεν έχει οριστεί</span>'}</p>
            </div>
          </div>`;
      } catch (err) {
        content.innerHTML = `<div class="card error">${err.message}</div>`;
      }
    }
    
    // Epeksergasia profil
    async function showEditProfile() {
      if (!id) return content.innerHTML = `<div class="card error">Δεν βρέθηκε συνεδρία χρήστη.</div>`;
      try {
        const p = await apiFetch(`${API_BASE}/profil/${id}`);
        content.innerHTML = `
          <div class="card">
            <h2>Επεξεργασία Προφίλ</h2>
            <div class="row">
              <div><label>Όνομα</label><input type="text" id="pf_onoma" value="${p.onoma || ''}" /></div>
              <div><label>Επώνυμο</label><input type="text" id="pf_epitheto" value="${p.epitheto || ''}" /></div>
            </div>
            <div class="row">
              <div><label>Email Επικοινωνίας</label><input type="email" id="pf_email" value="${p.email || ''}" /></div>
              <div><label>Κινητό</label><input type="text" id="pf_kinhto" value="${p.tilefono_kinhto || ''}" /></div>
            </div>
            <div class="row">
              <div><label>Σταθερό</label><input type="text" id="pf_stathero" value="${p.tilefono_stathero || ''}" /></div>
              <div><label>Α.Μ.</label><input type="text" id="pf_am" value="${p.AM || ''}" /></div>
            </div>
            <div class="row">
              <div><label>Οδός</label><input type="text" id="pf_odo" value="${p.dieythinsi_odo || ''}" /></div>
              <div><label>Αριθμός</label><input type="text" id="pf_ar" value="${p.dieythinsi_arithmos || ''}" /></div>
              <div><label>Πόλη</label><input type="text" id="pf_poli" value="${p.dieythinsi_polh || ''}" /></div>
              <div><label>Τ.Κ.</label><input type="text" id="pf_tk" value="${p.dieythinsi_tk || ''}" /></div>
            </div>
            <div class="sep"></div>
            <button id="btnSaveProfile">Αποθήκευση Αλλαγών</button>
          </div>`;

        document.getElementById('btnSaveProfile').addEventListener('click', async () => {
          try {
            await apiFetch(`${API_BASE}/profil/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type':'application/json' },
              body: JSON.stringify({
                onoma: document.getElementById('pf_onoma').value,
                epitheto: document.getElementById('pf_epitheto').value,
                email: document.getElementById('pf_email').value,
                tilefono_kinhto: document.getElementById('pf_kinhto').value,
                tilefono_stathero: document.getElementById('pf_stathero').value,
                AM: document.getElementById('pf_am').value,
                dieythinsi_odo: document.getElementById('pf_odo').value,
                dieythinsi_arithmos: document.getElementById('pf_ar').value,
                dieythinsi_polh: document.getElementById('pf_poli').value,
                dieythinsi_tk: document.getElementById('pf_tk').value
              })
            });
            alert('Το προφίλ ενημερώθηκε.');
            const newName = document.getElementById('pf_onoma').value;
            localStorage.setItem('username', newName);
            helloUserEl.textContent = newName ? newName : 'Φοιτητή';
          } catch (err) {
            alert(err.message);
          }
        });

      } catch (err) {
        content.innerHTML = `<div class="card error">${err.message}</div>`;
      }
    }

    // Diaxeirisi diplwmatikis
    async function showManageDiplomatiki() {
      if (!id) return content.innerHTML = `<div class="card error">Δεν βρέθηκε συνεδρία χρήστη.</div>`;
      try {
        const d = await apiFetch(`${API_BASE}/diplomatiki/byFoititis/${id}`);
        if (!d) return content.innerHTML = `<div class="card error">Δεν έχετε αναλάβει ακόμη διπλωματική εργασία.</div>`;

        // periptwsi ypo_anathesi
        if (d.katastasi === 'ypo_anathesi') {
          const proskliseis = await apiFetch(`${API_BASE}/trimelis/proskliseis/${d.id}`);
          content.innerHTML = `
            <div class="card">
              <h2>Διαχείριση - Υπό Ανάθεση</h2>
              <p>Τρέχοντες Συμμετέχοντες: ${d.melh_trimelous || '—'}</p>
              <div class="row">
                <input type="text" id="inviteDidaskonId" placeholder="ID Διδάσκοντα" />
                <button id="btnInvite">Πρόσκληση</button>
              </div>
              <div class="sep"></div>
              <h3>Προσκλήσεις</h3>
              ${proskliseis.map(p => `<div>${p.onoma} ${p.epitheto} (${p.katastasi_prosklisis})</div>`).join('')}
            </div>`;
            
          document.getElementById('btnInvite').onclick = async () => {
             const id_didaskonta = document.getElementById('inviteDidaskonId').value;
             await apiFetch(`${API_BASE}/trimelis/prosklisi`, { 
                 method: 'POST', headers:{'Content-Type':'application/json'}, 
                 body: JSON.stringify({id_diplomatikis:d.id, id_didaskonta}) 
             });
             showManageDiplomatiki();
          };

        // periptwsi ypo_exetasi kai peratomeni
        } else if ( (d.katastasi === 'ypo_exetasi' && d.final_bathmos) || d.katastasi === 'peratomeni' ){

           // yparxei telikos bathmos
           if (d.final_bathmos) {
               content.innerHTML = `
                <div class="card">
                    <h2>Ολοκλήρωση Εξέτασης</h2>
                    <p>Η εξέταση έχει ολοκληρωθεί. Ο τελικός βαθμός είναι: <strong>${d.final_bathmos}</strong></p>
                    
                    <div class="sep"></div>
                    
                    <h3>1. Πρακτικό Εξέτασης</h3>
                    ${d.praktiko_link 
                      ? `<p><a href="${d.praktiko_link}" target="_blank" class="button">📄 Προβολή Πρακτικού (HTML)</a></p>` 
                      : `<p class="muted">Το πρακτικό δεν έχει ανέβει ακόμη.</p>`
                    }

                    <div class="sep"></div>

                    <h3>2. Κατάθεση στο Νημερτής</h3>
                    <p class="muted">Παρακαλώ εισάγετε τον σύνδεσμο από το αποθετήριο της βιβλιοθήκης.</p>
                    <div class="row">
                        <input type="text" id="nimertisLinkInput" value="${d.nimertis_link || ''}" placeholder="https://nimertis..." style="flex:1;" />
                        <button id="btnSaveNimertis">Αποθήκευση Link</button>
                    </div>
                </div>
               `;

               // save nimertis link
               document.getElementById('btnSaveNimertis').onclick = async () => {
                   const link = document.getElementById('nimertisLinkInput').value;
                   if(!link) return alert('Παρακαλώ εισάγετε σύνδεσμο.');
                   try {
                       await apiFetch(`${API_BASE}/foititis/nimertis`, {
                           method: 'POST',
                           headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ id_diplomatikis: d.id, nimertis_link: link })
                       });
                       alert('Ο σύνδεσμος αποθηκεύτηκε επιτυχώς.');
                   } catch (err) { alert(err.message); }
               };

           // den yparxei telikos bathmos
           } else {
               content.innerHTML = `
                <div class="card">
                  <h2>Υπό Εξέταση — Προετοιμασία</h2>
                  <p>Ανεβάστε το Draft κείμενο μέσω της καρτέλας <strong>"Αρχεία"</strong>.</p>
                  <p>Ορίστε ημερομηνία παρουσίασης μέσω της καρτέλας <strong>"Ορισμός Ημερομηνίας Εξέτασης"</strong>.</p>
                  <div class="sep"></div>
                  <h3>Στοιχεία Παρουσίασης</h3>
                  ${d.imerominia_parousiasis 
                    ? `<p><strong>Ημερομηνία:</strong> ${new Date(d.imerominia_parousiasis).toLocaleDateString('el-GR')} <br>
                       <strong>Ώρα:</strong> ${d.ora_parousiasis || '-'} <br>
                       <strong>Τοποθεσία:</strong> ${d.topothesia || '-'}</p>`
                    : `<p class="muted">Δεν έχει οριστεί ημερομηνία.</p>`
                  }
                </div>`;
           }

        } else {
           content.innerHTML = `<div class="card"><h2>Κατάσταση: ${d.katastasi}</h2></div>`;
        }
      } catch (err) {
        content.innerHTML = `<div class="card error">${err.message}</div>`;
      }
    }
    
    // Upload arxeiwn & syndesmwn
      async function showArxeia() {
      if (!id) return;
      
      try {
        const d = await apiFetch(`${API_BASE}/diplomatiki/byFoititis/${id}`);
        
        if (!d) {
             content.innerHTML = `<div class="card error">Δεν βρέθηκε διπλωματική εργασία.</div>`;
             return;
        }

        // an diplomatiki den einai ypo_exetasi error
        if (d.katastasi !== 'ypo_exetasi') {
            content.innerHTML = `
                <div class="card error">
                    <h3>Μη Διαθέσιμη Λειτουργία</h3>
                    <p>Η διαχείριση αρχείων και συνδέσμων είναι διαθέσιμη <strong>μόνο</strong> όταν η διπλωματική είναι σε κατάσταση <strong>"Υπό Εξέταση"</strong>.</p>
                    <p>Τρέχουσα κατάσταση: ${translateStatus(d.katastasi)}</p>
                </div>`;
            return;
        }
        
        const files = await apiFetch(`${API_BASE}/diplomatiki/${d.id}/arxeia`);

        content.innerHTML = `
          <div class="card">
            <h2>Αρχεία & Υλικό Τεκμηρίωσης</h2>
            <p class="muted">Ανεβάστε το πρόχειρο κείμενο (Draft), αρχεία ή συνδέσμους για την επιτροπή.</p>
            
            <form id="formUploadArxeio" class="card" style="background:#f9fafb; border:1px dashed #ccc;">
              <h3>Προσθήκη Νέου</h3>
              <div class="row">
                <div>
                  <label>Τύπος</label>
                  <select id="uploadType">
                    <option value="keimeno">Κείμενο (Draft PDF)</option>
                    <option value="ypostiriktiko">Υποστηρικτικό Υλικό (Photos, Videos, etc.)</option>
                    <option value="link">Εξωτερικός Σύνδεσμος</option>
                  </select>
                </div>
                <div id="fileInputContainer">
                  <label>Επιλογή Αρχείου</label>
                  <input type="file" id="uploadFile" />
                </div>
                <div id="linkInputContainer" style="display:none;">
                  <label>URL Συνδέσμου</label>
                  <input type="text" id="uploadLink" placeholder="https://..." />
                  <label>Περιγραφή (Προαιρετικό)</label>
                  <input type="text" id="uploadName" placeholder="π.χ. Google Drive Video" />
                </div>
              </div>
              <button type="submit" style="margin-top:10px;">Μεταφόρτωση</button>
            </form>

            <div class="sep"></div>

            <h3>Λίστα Αρχείων</h3>
            ${files.length === 0 ? '<p>Δεν υπάρχουν αρχεία.</p>' : ''}
            <div class="grid">
              ${files.map(f => {
                const icon = f.typos === 'link' ? '🔗' : '📄';
                const label = f.typos === 'keimeno' ? 'Draft Κείμενο' : 
                              f.typos === 'ypostiriktiko' ? 'Υποστηρικτικό' : 'Σύνδεσμος';
                return `
                  <div class="card" style="text-align:left;">
                    <div style="font-size:1.2em;">${icon} <strong>${label}</strong></div>
                    <div class="muted">${f.onoma_arxeiou || '-'}</div>
                    <div style="margin-top:5px;">
                      <a href="${f.link}" target="_blank" class="button alt" style="padding:4px 8px; font-size:0.9em;">Άνοιγμα</a>
                    </div>
                    <div class="muted" style="font-size:0.8em; margin-top:5px;">${new Date(f.hmerominia).toLocaleString('el-GR')}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

        const typeSelect = document.getElementById('uploadType');
        const fileDiv = document.getElementById('fileInputContainer');
        const linkDiv = document.getElementById('linkInputContainer');

        typeSelect.addEventListener('change', () => {
          if (typeSelect.value === 'link') {
            fileDiv.style.display = 'none';
            linkDiv.style.display = 'block';
          } else {
            fileDiv.style.display = 'block';
            linkDiv.style.display = 'none';
          }
        });

        document.getElementById('formUploadArxeio').addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const formData = new FormData();
          formData.append('id_diplomatikis', d.id);
          formData.append('typos', typeSelect.value);

          if (typeSelect.value === 'link') {
            const url = document.getElementById('uploadLink').value;
            const name = document.getElementById('uploadName').value;
            if (!url) return alert('Παρακαλώ εισάγετε σύνδεσμο.');
            formData.append('link', url);
            formData.append('onoma_arxeiou', name);
          } else {
            const file = document.getElementById('uploadFile').files[0];
            if (!file) return alert('Παρακαλώ επιλέξτε αρχείο.');
            formData.append('file', file);
          }

          try {
            await fetch(`${API_BASE}/diplomatiki/arxeia`, {
              method: 'POST',
              body: formData
            }).then(async res => {
               if (!res.ok) throw new Error('Σφάλμα ανεβάσματος');
            });
            alert('Η καταχώρηση ολοκληρώθηκε.');
            showArxeia();
          } catch (err) {
            alert(err.message);
          }
        });

      } catch (err) {
        content.innerHTML = `<div class="card error">${err.message}</div>`;
      }
    }

// synarthsh gia orismo hmerominias parousiasis
async function showOrismosImerominiasParousiasis() {
  try {
    const d = await apiFetch(`${API_BASE}/diplomatiki/byFoititis/${id}`);
    
    if (!d) {
             content.innerHTML = `<div class="card error">Δεν βρέθηκε διπλωματική εργασία.</div>`;
      return;
    }

    if (d.katastasi !== 'ypo_exetasi') {
      content.innerHTML = `<div class="card error">
                    <h3>Μη Διαθέσιμη Λειτουργία</h3>
                    <p>Η διαχείριση αρχείων και συνδέσμων είναι διαθέσιμη <strong>μόνο</strong> όταν η διπλωματική είναι σε κατάσταση <strong>"Υπό Εξέταση"</strong>.</p>
                    <p>Τρέχουσα κατάσταση: ${translateStatus(d.katastasi)}</p>
                </div>`;
      return;
    }
    
    // emfanisi form an plhrei tis proypotheseis
    content.innerHTML = `
      <div class="card">
        <h2>Ορισμός Ημερομηνίας Παρουσίασης</h2>
        <form id="form_orismos_parousiasis">
          <div class="row">
            <div>
              <label for="imerominia_parousiasis">Ημερομηνία</label>
              <input type="date" id="imerominia_parousiasis" required />
            </div>
            <div>
              <label for="ora_parousiasis">Ώρα</label>
              <input type="time" id="ora_parousiasis" required />
            </div>
          </div>
          <div class="row">
            <div>
              <label for="tropo_parousiasis">Τρόπος</label>
              <select id="tropo_parousiasis">
                <option value="di_zosis">Δια ζώσης</option>
                <option value="online">Online</option>
              </select>
            </div>
            <div>
              <label for="topothesia">Αίθουσα/Σύνδεσμος</label>
              <input type="text" id="topothesia" required />
            </div>
          </div>
          <div class="sep"></div>
          <button type="submit">Αποθήκευση</button>
          <button type="button" id="btnBack">Επιστροφή</button>
        </form>
      </div>`;
    
    document.getElementById('form_orismos_parousiasis').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        id_diplomatikis: d.id, // to id ths diplomatikis pou kaname fetch
        imerominia: document.getElementById("imerominia_parousiasis").value,
        wra: document.getElementById("ora_parousiasis").value,
        tropos: document.getElementById("tropo_parousiasis").value,
        topothesia: document.getElementById("topothesia").value
      };
      try {
        await apiFetch('/api/foititis/orismos_parousiasis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        content.innerHTML = `<div class="card success">Η ημερομηνία παρουσίασης ορίστηκε!</div>`;
      } catch (err) {
        content.innerHTML = `<div class="card error">Σφάλμα: ${err.message}</div>`;
      }
    });
    document.getElementById('btnBack').addEventListener('click', showMyDiplomatiki);
  } catch (err) {
    content.innerHTML = `<div class="card error">${err.message}</div>`;
  }
}

    // Synartisi arxikopoihshs selidas foititi pou kalei to index
function initFoititisPage(username) {
        const btnMyDiplomatiki = document.getElementById('btnMyDiplomatiki');
        if (btnMyDiplomatiki) btnMyDiplomatiki.onclick = showMyDiplomatiki;
        
        const btnEditProfile = document.getElementById('btnEditProfile');
        if (btnEditProfile) btnEditProfile.onclick = showEditProfile;
        
        const btnManageDiplomatiki = document.getElementById('btnManageDiplomatiki');
        if (btnManageDiplomatiki) btnManageDiplomatiki.onclick = showManageDiplomatiki;

        const btnOrismosImerominias = document.getElementById('btnOrismosImerominias');
        if (btnOrismosImerominias) btnOrismosImerominias.onclick = showOrismosImerominiasParousiasis;

        const btnArxeia = document.getElementById('btnArxeia');
        if (btnArxeia) btnArxeia.onclick = showArxeia;

        const span = document.getElementById('usernameDisplay');
        if (span && username) {
            span.textContent = username.charAt(0).toUpperCase() + username.slice(1);
        }
    }
  }
</script>
