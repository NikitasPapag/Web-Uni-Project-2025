<!-- Arxiko HTML gia grammateia -->
<div class="grammateia centered">
  <h1>Πίνακας Ελέγχου Γραμματείας</h1>
  <button onclick="provoliDE()">Προβολή Διπλωματικών</button>
  <button onclick="eisagogiDedomenwn()">Εισαγωγή Δεδομένων (JSON)</button>
  <button onclick="diaxeirisiDiplwmatikisGrammateia()">Διαχείριση Διπλωματικών</button>
  <div id="periexomeno"></div>
</div>

<script>
// Synarthsh: Provlei diplwmatikes me katastasi energi h ypo_exetasi
function provoliDE() {
  const diplwmatikes = JSON.parse(localStorage.getItem('diplwmatikes')) || [];

  const filtrarismenes = diplwmatikes.filter(de =>
    de.katastasi === 'energi' || de.katastasi === 'ypo_exetasi');

  let html = '<h2>Διπλωματικές (Ενεργή & Υπό Εξέταση)</h2>';

  filtrarismenes.forEach(de => {
    const meres = meresApoAnathesi(de.hmerominia_anathesis);
    html += `
      <div class="kartela-de">
        <h3>${de.titlos}</h3>
        <p><strong>Περιγραφή:</strong> ${de.perigrafi}</p>
        <p><strong>Κατάσταση:</strong> ${de.katastasi}</p>
        <p><strong>Μέρες από ανάθεση:</strong> ${meres}</p>
        <p><strong>Τριμελής Επιτροπή:</strong> ${de.trimelis?.join(', ') || 'Δεν ορίστηκε'}</p>
      </div>
    `;
  });
  document.getElementById('periexomeno').innerHTML = html;
}

// Synarthsh: Eisagei JSON dedomena foititwn kai didaskontwn
function eisagogiDedomenwn() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const arxeio = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const dedomena = JSON.parse(evt.target.result);
        localStorage.setItem('json_import', JSON.stringify(dedomena));
        alert('Τα δεδομένα φορτώθηκαν με επιτυχία!');
      } catch (err) {
        alert('Λάθος μορφή JSON αρχείου!');
      }
    };
    reader.readAsText(arxeio);
  };
  input.click();
}

// Synarthsh: Diaxeirisi diplwmatikwn apo grammateia
function diaxeirisiDiplwmatikisGrammateia() {
  const diplwmatikes = JSON.parse(localStorage.getItem('diplwmatikes')) || [];

  let html = '<h2>Διαχείριση Διπλωματικών</h2>';

  diplwmatikes.forEach(de => {
    html += `
      <div class="kartela-de">
        <h3>${de.titlos}</h3>
        <p><strong>Κατάσταση:</strong> ${de.katastasi}</p>
    `;

    if (de.katastasi === 'energi') {
      html += `
        <p><label>Α.Π. Γ.Σ.: <input type="text" id="ap_${de.id}" /></label></p>
        <p><label>Ακύρωση (λόγος): <input type="text" id="akyrwsi_${de.id}" /></label></p>
        <button onclick="kataxwrisiEgkrisis(${de.id})">Καταγραφή Έγκρισης</button>
        <button onclick="akyrwsiThematos(${de.id})">Ακύρωση Θέματος</button>
      `;
    } else if (de.katastasi === 'ypo_exetasi') {
      if (de.final_bathmos && de.nimertis_link) {
        html += `<button onclick="peratwsi(${de.id})">Μεταφορά σε 'Περατωμένη'</button>`;
      } else {
        html += `<p>Δεν έχει καταχωρηθεί βαθμός ή σύνδεσμος Νημερτής.</p>`;
      }
    }

    html += '</div>';
  });

  document.getElementById('periexomeno').innerHTML = html;
}

// Synarthsh: upologizei meres apo thn hmerominia anathesis
function meresApoAnathesi(hmerominia) {
  if (!hmerominia) return 'Δεν έχει οριστεί';
  const simera = new Date();
  const anathesi = new Date(hmerominia);
  const diafora = Math.floor((simera - anathesi) / (1000 * 60 * 60 * 24));
  return `${diafora} ημέρες`;
}

// Dummy synarthseis gia paradeigma
function kataxwrisiEgkrisis(id) {
  const ap = document.getElementById(`ap_${id}`).value;
  alert(`Καταγραφή Α.Π. για ΔΕ ${id}: ${ap}`);
}

function akyrwsiThematos(id) {
  const logos = document.getElementById(`akyrwsi_${id}`).value;
  alert(`Ακύρωση θέματος για ΔΕ ${id}. Λόγος: ${logos}`);
}

function peratwsi(id) {
  alert(`Η ΔΕ ${id} ορίστηκε ως Περατωμένη.`);
}
</script>
