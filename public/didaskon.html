<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Πίνακας Διδάσκοντα</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="body.rolos">  
  <header>
  <h1>Καλώς ήρθατε <span id="who"></span> ! <br> Χρησιμοποιήστε τα κουμπιά για να περιηγηθείτε. </h1>
  </header>

  <main>
    <div class="bar">
      <button id="btnThemata">Τα Θέματά μου</button>
      <button id="btnAnathesi">Ανάθεση Θέματος</button>
      <button id="btnProskliseis" class="alt">Προσκλήσεις Τριμελούς</button>
      <button id="btnDiplomatikes">Οι Διπλωματικές μου</button>
    </div>

    <div id="content"></div>
  </main>

  <script>
  {
    // eidopoiiseis
    function showToast(message, type = 'success') {
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        // eikonidia
        const icon = type === 'success' ? '✅' : '⚠️';
        
        toast.innerHTML = `
            <span class="toast-icon">${icon}</span>
            <span>${message}</span>
        `;

        container.appendChild(toast);

        // 5 deuterolepta diarkeia
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.5s forwards';
            setTimeout(() => toast.remove(), 500);
        }, 5000);
    }

    // Toggle function for expandable list (Same as Grammateia)
    function toggleDetails(id) {
      const detailsDiv = document.getElementById(`details-${id}`);
      if (detailsDiv.style.display === "none") {
        detailsDiv.style.display = "block";
      } else {
        detailsDiv.style.display = "none";
      }
    }

    const id = localStorage.getItem('id');
    const username = localStorage.getItem('username');
    const rolos = localStorage.getItem('rolos');
    const API_BASE = 'http://localhost:3000/api';
    const content = document.getElementById('content');
      
      if (!id || rolos !== 'didaskon') {
          content.innerHTML = `<section>Δεν είστε συνδεδεμένος/η ως Διδάσκων. Παρακαλώ κάντε είσοδο.</section>`;
      } else {
          document.getElementById('who').textContent = `${username}`;
      }

    async function apiFetch(url, opts = {}) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(()=> ({}));
      if (!res.ok) throw new Error(data.error || 'Σφάλμα αιτήματος.');
      return data;
    }
    const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    // Themata didaskonta
    async function showThemata() {
      if (!id) return;
      try {
        const themata = await apiFetch(`${API_BASE}/didaskon/${id}/themata`);
        
        let html = `
            <div class="actions" style="position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; min-height: 40px;">
                <h2 style="margin:0;">Τα Θέματά μου</h2>
                <button id="btnNewThema" class="button" style="position: absolute; right: 0;">＋ Νέο Θέμα</button>
            </div>
            
            <div class="list-container">`;

        if (themata.length === 0) {
            html += `<div class="card muted" style="text-align:center;">Δεν έχετε καταχωρήσει θέματα.</div>`;
        } else {
            themata.forEach(t => {
                const shortDesc = t.perigrafi && t.perigrafi.length > 150 
                                  ? t.perigrafi.substring(0, 150) + '...' 
                                  : (t.perigrafi || '<span class="muted">Χωρίς περιγραφή</span>');

                html += `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${t.titlos}</div>
                        <p class="list-item-desc">${shortDesc}</p>
                        ${t.arxeio ? `<div class="list-item-meta">📎 PDF Αρχείο Διαθέσιμο</div>` : ''}
                    </div>
                    
                    <div class="list-item-actions">
                        <button class="btn-edit button small alt" data-id="${t.id}">✏️ Επεξεργασία</button>
                    </div>
                </div>`;
            });
        }
        html += `</div>`;
        content.innerHTML = html;

          // listeners gia koumpia
          document.getElementById('btnNewThema').onclick = () => editThema(null);
          document.querySelectorAll('.btn-edit').forEach(btn => {
              btn.onclick = () => editThema(btn.dataset.id);
          });

        } catch (err) {
          content.innerHTML = `<div class="card error">${err.message}</div>`;
        }
      }

    // Neo thema didaskonta
    function formNewThema() {
      content.innerHTML = `
        <section>
          <h3>Νέο Θέμα</h3>
          <label>Τίτλος</label>
          <input id="titlos" type="text" />
          <label>Περιγραφή</label>
          <textarea id="perigrafi"></textarea>
          <div class="row">
            <button onclick="saveNewThema()">Αποθήκευση</button>
            <button class="alt" onclick="showThemata()">Άκυρο</button>
          </div>
        </section>`;
    }
    async function saveNewThema() {
      const titlos = document.getElementById('titlos').value.trim();
      const perigrafi = document.getElementById('perigrafi').value.trim();
      if (!titlos) return showToast('Συμπληρώστε τίτλο.', 'error');
      try {
        await apiFetch('/api/themata', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ titlos, perigrafi, id_didaskonta: id })
        });
        showThemata();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function editThema(themaId) {
        let thema = { titlos: '', perigrafi: '', arxeio: null };
        let isEdit = false;

        if (themaId) {
            isEdit = true;
            try {
                const list = await apiFetch(`${API_BASE}/didaskon/${id}/themata`);
                thema = list.find(t => t.id == themaId) || thema;
            } catch (err) {
                console.error(err);
            }
        }

        content.innerHTML = `
        <div class="card">
            <h2>${isEdit ? 'Επεξεργασία Θέματος' : 'Δημιουργία Νέου Θέματος'}</h2>
            <form id="formThema">
                <div class="row">
                    <div>
                        <label>Τίτλος</label>
                        <input type="text" id="th_titlos" value="${thema.titlos}" required />
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Περιγραφή</label>
                        <textarea id="th_perigrafi" rows="4">${thema.perigrafi || ''}</textarea>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Αρχείο Περιγραφής (PDF)</label>
                        <input type="file" id="th_arxeio" accept="application/pdf" />
                        ${isEdit && thema.arxeio ? `<p class="muted">Υπάρχει ήδη αρχείο: ${thema.arxeio}</p>` : ''}
                    </div>
                </div>
                
                <div class="sep"></div>
                
                <div class="actions">
                    <button type="submit" class="button success">Αποθήκευση</button>
                    <button type="button" id="btnCancel" class="button alt">Άκυρο</button>
                    ${isEdit ? `<button type="button" id="btnDelete" class="button error">Διαγραφή</button>` : ''}
                </div>
            </form>
        </div>`;

        // koumpi akyrosis
        document.getElementById('btnCancel').onclick = showThemata;

        // koumpi diagrafis
        if (isEdit) {
            document.getElementById('btnDelete').onclick = async () => {
                try {
                    const res = await fetch(`${API_BASE}/themata/${themaId}`, { method: 'DELETE' });
                    
                    if (!res.ok) {
                        throw new Error('Η διαγραφή απέτυχε. Το θέμα ίσως έχει ήδη ανατεθεί σε φοιτητή.');
                    }

                    showToast('Διαγράφηκε επιτυχώς.', 'success');
                    showThemata();
                } catch(err) { 
                    showToast('Σφάλμα: ' + err.message, 'error'); 
                }
            };
        }

        // koumpi apothikefsis
        document.getElementById('formThema').onsubmit = async (e) => {
            e.preventDefault();
            
            const fd = new FormData();
            fd.append('titlos', document.getElementById('th_titlos').value);
            fd.append('perigrafi', document.getElementById('th_perigrafi').value);
            fd.append('id_didaskonta', id); 
            
            const fileInput = document.getElementById('th_arxeio');
            if (fileInput.files[0]) {
                fd.append('arxeio', fileInput.files[0]);
            }

            try {
                let url = `${API_BASE}/themata`;
                
                if (isEdit) {
                    url = `${API_BASE}/themata/update/${themaId}`;
                }

                const res = await fetch(url, {
                    method: 'POST', 
                    body: fd
                });
                
                if (!res.ok) throw new Error('Σφάλμα αποθήκευσης');
                
                showToast('Αποθηκεύτηκε!', 'success');
                showThemata();
            } catch (err) {
                showToast(err.message, 'error');
            }
        };
    }

    //anathesi thematos
    async function showAnathesiPage() {
        let myThemata = [];
        try {
            const allThemata = await apiFetch(`${API_BASE}/didaskon/${id}/themata`);
            myThemata = allThemata;
        } catch(e) { console.error(e); }

        content.innerHTML = `
            <div class="card">
                <h2>Ανάθεση Θέματος</h2>
                <p>Επιλέξτε ένα από τα διαθέσιμα θέματά σας και αναζητήστε τον φοιτητή.</p>
                
                <form id="formAnathesi">
                    <div class="row">
                        <div>
                            <label>Επιλογή Θέματος</label>
                            <select id="selThema" required>
                                <option value="">-- Επιλέξτε Θέμα --</option>
                                ${myThemata.map(t => `<option value="${t.id}">${t.titlos}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="row" style="position: relative;">
                        <div>
                            <label>Αναζήτηση Φοιτητή (ΑΜ ή Όνομα)</label>
                            <input type="text" id="Foititis" placeholder="π.χ. 1059 ή Παπαδόπουλος" autocomplete="off" required />
                            <div id="anazitisiResults"></div>
                        </div>
                    </div>

                    <input type="hidden" id="selectedFoititisId" />
                    
                    <div style="margin-top: 10px; font-weight: bold; color: var(--p);" id="selectedFoititisName"></div>

                    <div class="sep"></div>
                    <button type="submit" class="button">Προσωρινή Ανάθεση</button>
                </form>
            </div>
        `;

        // anazitisi foititi
        const Input = document.getElementById('Foititis');
        // CHANGED: ID to match style.css (#anazitisiResults)
        const resultsBox = document.getElementById('anazitisiResults'); 
        resultsBox.id = "anazitisiResults"; // Dynamically fix ID or change it in HTML above to id="anazitisiResults"

        const hiddenId = document.getElementById('selectedFoititisId');
        const displaySelected = document.getElementById('selectedFoititisName');

        Input.onkeyup = async () => {
            const term = Input.value;
            if (term.length < 2) {
                resultsBox.style.display = 'none';
                return;
            }

            try {
                // CHANGED: Endpoint matches server.js ('/foitites/anazitisi')
                const results = await apiFetch(`${API_BASE}/foitites/anazitisi?q=${encodeURIComponent(term)}`);
                
                if (results.length > 0) {
                    resultsBox.innerHTML = results.map(s => `
                        <div class="anazitisi-item" data-id="${s.id}" data-name="${s.onoma} ${s.epitheto} (${s.AM})">
                            <strong>${s.epitheto} ${s.onoma}</strong> <br>
                            <small>AM: ${s.AM}</small>
                        </div>
                    `).join('');
                    resultsBox.style.display = 'block';

                    // mihanismos epilogis apo lista
                    // CHANGED: Selector matches the new class
                    document.querySelectorAll('.anazitisi-item').forEach(item => {
                        item.onclick = () => {
                            Input.value = item.dataset.name;
                            hiddenId.value = item.dataset.id;
                            displaySelected.textContent = `Επιλέχθηκε: ${item.dataset.name}`;
                            resultsBox.style.display = 'none';
                        };
                    });
                } else {
                    resultsBox.innerHTML = '<div style="padding:10px;">Δεν βρέθηκαν αποτελέσματα</div>';
                    resultsBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        };

        // apokripsi apotelesmaton otan ginetai click ektos
        document.addEventListener('click', (e) => {
            if (e.target !== Input) resultsBox.style.display = 'none';
        });

        // kataxorisi anathesis
        document.getElementById('formAnathesi').onsubmit = async (e) => {
            e.preventDefault();
            
            const id_thematos = document.getElementById('selThema').value;
            const id_foititi = hiddenId.value;

            if (!id_thematos) return showToast('Παρακαλώ επιλέξτε θέμα.', 'error');
            if (!id_foititi) return showToast('Παρακαλώ επιλέξτε φοιτητή από τη λίστα.', 'error');

            try {
                await fetch(`${API_BASE}/anathesi`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_thematos, id_foititi })
                }).then(async res => {
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Σφάλμα ανάθεσης');
                });

                showToast('Η ανάθεση έγινε επιτυχώς (Υπό Ανάθεση).', 'success');
                showAnathesiPage();
            } catch (err) {
                showToast(err.message, 'error');
            }
        };
    }

    // Proskliseis
  async function showProskliseis() {
      if (!id) return;
      try {
        const allProskliseis = await apiFetch(`${API_BASE}/didaskon/${id}/proskliseis`);
        
        const pending = allProskliseis.filter(p => p.katastasi === 'ekremis');
        
        
        let html = `
            <div class="actions" style="position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; min-height: 40px;">
                <h2 style="margin:0;">Εκκρεμείς Προσκλήσεις</h2>
            </div>
            
            <div class="list-container">`;

        if (pending.length === 0) {
             html += `<div class="card muted" style="text-align:center;">Δεν υπάρχουν νέες προσκλήσεις.</div>`;
        } else {
             pending.forEach(p => {
                 html += `
                 <div class="list-item">
                     <div class="list-item-content">
                         <div class="list-item-title">${p.epitheto_foititi} ${p.onoma_foititi}</div>
                         <p class="list-item-desc">Θέμα: "${p.titlos}"</p>
                         <div class="list-item-meta" style="font-weight:normal;">Email: ${p.email_foititi}</div>
                     </div>
                     
                     <div class="list-item-actions" style="display:flex; gap:10px;">
                         <button class="button success small btn-accept" data-id="${p.id_prosklisis}">✔ Αποδοχή</button>
                         <button class="button error small btn-reject" data-id="${p.id_prosklisis}">✖ Απόρριψη</button>
                     </div>
                 </div>`;
             });
        }
        html += `</div>`;
        content.innerHTML = html;
        
        // kataxorisi katastasis apofasis
        // ... inside showProskliseis ...

        const sendDecision = async (id_prosklisis, decision) => {
            try {
                await fetch(`${API_BASE}/proskliseis/${id_prosklisis}/apantisi`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ katastasi: decision })
                }).then(async res => {
                    if (!res.ok) throw new Error('Σφάλμα ενημέρωσης.');
                });
                
                showToast(decision === 'apodexti' ? 'Η πρόσκληση έγινε αποδεκτή.' : 'Η πρόσκληση απορρίφθηκε.', 'success');
                showProskliseis();
            } catch (err) {
                showToast(err.message, 'error');
            }
        };

        document.querySelectorAll('.btn-accept').forEach(btn => {
            btn.onclick = () => {
                sendDecision(btn.dataset.id, 'apodexti');
            };
        });

        document.querySelectorAll('.btn-reject').forEach(btn => {
            btn.onclick = () => {
                sendDecision(btn.dataset.id, 'aporrifthi');
            };
        });

      } catch (err) {
        content.innerHTML = `<div class="card error">${err.message}</div>`;
      }
    }

// Helper function for detailed elapsed time
    function getTimeElapsed(dateString) {
      if (!dateString) return "—";
      const start = new Date(dateString);
      const now = new Date();
      
      const diffTime = Math.abs(now - start);
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (totalDays < 1) return "Σήμερα";
      if (totalDays === 1) return "Εχθές";
      if (totalDays < 30) return `${totalDays} ημέρες`;
      
      if (totalDays < 365) {
          const months = Math.floor(totalDays / 30);
          return months === 1 ? "1 μήνας" : `${months} μήνες`;
      } 
      
      const years = Math.floor(totalDays / 365);
      const remainingDays = totalDays % 365;
      const extraMonths = Math.floor(remainingDays / 30);

      let output = years === 1 ? "1 χρόνος" : `${years} χρόνια`;
      
      if (extraMonths > 0) {
          output += extraMonths === 1 ? " και 1 μήνας" : ` και ${extraMonths} μήνες`;
      }
      
      return output;
    }

    // Helper for status translation
    function translateStatus(status) {
        const map = {
            'energi': 'Ενεργή',
            'ypo_exetasi': 'Υπό Εξέταση',
            'ypo_anathesi': 'Υπό Ανάθεση',
            'peratomeni': 'Περατωμένη',
            'akyromeni': 'Ακυρωμένη'
        };
        return map[status] || status;
    }

// Main Function: Show My Diplomatikes (Expandable + Export)
    async function showDiplomatikes() {
      if (!id) return;
      content.innerHTML = '<div class="card">Φόρτωση...</div>';

      try {
        const list = await apiFetch(`${API_BASE}/didaskon/${id}/diplwmatikes`);
        
        let html = `
            <div class="actions" style="margin-bottom: 20px;">
                <h2 style="margin:0;">Οι Διπλωματικές μου</h2>
            </div>
            
            <div class="list-container">`;

        if (list.length === 0) {
          html += `<div class="card muted" style="text-align:center;">Δεν βρέθηκαν διπλωματικές.</div>`;
        } else {
          list.forEach(d => {
            const statusLabel = translateStatus(d.katastasi);
            const elapsed = getTimeElapsed(d.hmerominia_anathesis);
            const dateStr = d.hmerominia_anathesis ? new Date(d.hmerominia_anathesis).toLocaleDateString('el-GR') : '-';

            html += `
            <div class="list-item clickable-diplomatiki" style="display:block; padding:0; border-left: 5px solid var(--p); margin-bottom: 10px;">
                
                <div class="diplomatiki-header" onclick="toggleDetails(${d.id})" style="padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div class="header-main" style="text-align:left;">
                        <span class="diplomatiki-title" style="font-weight:bold; font-size:1.1em; color:var(--p);">${d.titlos}</span>
                    </div>
                    <span class="status-pill status-${d.katastasi}">${statusLabel}</span>
                </div>

                <div id="details-${d.id}" class="diplomatiki-details" style="display: none; padding: 0 15px 15px 15px; text-align: left; border-top: 1px solid #eee;">
                    
                    <div style="margin-top: 15px; display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                        <div>
                            <p style="margin:5px 0;"><strong>👨‍🎓 Φοιτητής:</strong> ${d.foititis_onoma} ${d.foititis_epitheto}</p>
                            <p class="muted" style="margin:0 0 5px 0;">${d.foititis_email}</p>
                            <p style="margin:5px 0;"><strong>👥 Επιτροπή:</strong> ${d.trimelis_epitropi || 'Δεν ορίστηκε ακόμη'}</p>
                        </div>
                        <div>
                            <p style="margin:5px 0;"><strong>📅 Ημ. Ανάθεσης:</strong> ${dateStr}</p>
                            <p style="margin:5px 0;"><strong>⏱️ Χρόνος Υλοποίησης:</strong> ${elapsed}</p>
                        </div>
                    </div>

                    ${d.katastasi === 'peratomeni' ? `
                        <div style="background:#f0fdf4; padding:10px; margin-top:15px; border-radius:8px; border:1px solid #bbf7d0;">
                            <p style="margin:0; color:#166534;">
                                <strong>Τελικός Βαθμός:</strong> ${d.final_bathmos || '-'}
                            </p>
                            <div style="margin-top:10px; display:flex; gap:10px;">
                                 ${d.praktiko_link ? `<a href="${d.praktiko_link}" target="_blank" class="button small">📄 Πρακτικό</a>` : ''}
                                 ${d.nimertis_link ? `<a href="${d.nimertis_link}" target="_blank" class="button small alt">🔗 Νημερτής</a>` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            </div>`;
          });
        }
        
        // --- NEW: Export Section ---
        if (list.length > 0) {
            html += `
            <div class="sep"></div>
            <div class="card" style="margin-top: 20px; background: #f9fafb;">
                <h3>Εξαγωγή λίστας</h3>
                <p class="muted">Κατεβάστε όλα τα στοιχεία των παραπάνω διπλωματικών.</p>
                <div class="row" style="justify-content: center; gap: 15px;">
                    <button id="btnExportCSV" class="button">Εξαγωγή σε CSV</button>
                    <button id="btnExportJSON" class="button alt">Εξαγωγή σε JSON</button>
                </div>
            </div>`;
        }

        html += `</div>`;
        content.innerHTML = html;

        // --- EXPORT HANDLERS ---
        if (list.length > 0) {
            
            // Helper to trigger download
            const downloadFile = (content, fileName, contentType) => {
                const a = document.createElement("a");
                const file = new Blob([content], { type: contentType });
                a.href = URL.createObjectURL(file);
                a.download = fileName;
                a.click();
            };

            // 1. JSON Export
            document.getElementById('btnExportJSON').onclick = () => {
                const jsonContent = JSON.stringify(list, null, 2);
                downloadFile(jsonContent, 'diplomatikes_list.json', 'application/json');
            };

            // 2. CSV Export
            document.getElementById('btnExportCSV').onclick = () => {
                // Get headers from first object
                const headers = Object.keys(list[0]);
                const csvRows = [];
                
                // Add header row
                csvRows.push(headers.join(','));
                
                // Add data rows
                list.forEach(row => {
                    const values = headers.map(header => {
                        let val = row[header] === null || row[header] === undefined ? '' : row[header];
                        // Escape quotes and wrap in quotes to handle commas
                        val = String(val).replace(/"/g, '""'); 
                        return `"${val}"`;
                    });
                    csvRows.push(values.join(','));
                });
                
                const csvContent = csvRows.join('\n');
                // Add BOM for Excel UTF-8 compatibility
                downloadFile('\uFEFF' + csvContent, 'diplomatikes_list.csv', 'text/csv;charset=utf-8;');
            };
        }

      } catch (e) {
        content.innerHTML = `<div class="card error">${e.message}</div>`;
      }
    }

function initDidaskonPage(username) {

    if (span && username) {
        span.textContent = username;
    }
  }
}
